name: CI

on:
  push:
    branches:
      - main
      - "integrate/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for CSS corruption
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -nEi '</script>|__next_f' app/globals.css || true)"
          if [ -n "$MATCHES" ]; then
            FIRST_LINE="$(echo "$MATCHES" | head -n1 | cut -d: -f1)"
            echo "::error file=app/globals.css,line=$FIRST_LINE::globals.css appears corrupted (script payload detected)"
            echo "$MATCHES"
            exit 1
          fi

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "ci-test-secret"

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "ci-build-secret"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          DATABASE_URL: "file:./e2e.db"
          AUTH_SECRET: "e2e-secret"
          AUTH_ADMIN_EMAIL: "admin@wymap.local"
          AUTH_ADMIN_PASSWORD: "ChangeMe123!"
